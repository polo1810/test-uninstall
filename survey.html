<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pourquoi nous quittez-vous ? - MonAppTest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
    }
    .card {
      background: #ffffff;
      max-width: 560px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #1a1a2e;
    }
    .subtitle {
      color: #6b7280;
      margin: 0 0 28px;
      font-size: 15px;
    }
    .question {
      font-weight: 600;
      margin: 24px 0 12px;
      font-size: 15px;
    }
    .option {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin: 8px 0;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option:hover {
      border-color: #667eea;
      background: #f5f7ff;
    }
    .option input[type="radio"] {
      margin-right: 12px;
      accent-color: #667eea;
      width: 18px;
      height: 18px;
    }
    .option input[type="radio"]:checked + span {
      font-weight: 600;
      color: #667eea;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.15s ease;
    }
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
    }
    .thanks {
      text-align: center;
      padding: 40px 20px;
    }
    .thanks h2 {
      font-size: 24px;
      color: #16a34a;
      margin: 16px 0 8px;
    }
    .thanks p {
      color: #6b7280;
      font-size: 15px;
    }
    .emoji {
      font-size: 56px;
    }
    .hidden { display: none; }
    #userId {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 24px;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-view">
      <h1>Vous nous quittez deja ?</h1>
      <p class="subtitle">Aidez-nous a nous ameliorer en 30 secondes. Vos reponses sont anonymes.</p>

      <form id="surveyForm">
        <div class="question">Pourquoi desinstallez-vous MonAppTest ?</div>
        <label class="option"><input type="radio" name="reason" value="too_complex" required><span>Trop complique a utiliser</span></label>
        <label class="option"><input type="radio" name="reason" value="missing_features"><span>Il manque des fonctionnalites</span></label>
        <label class="option"><input type="radio" name="reason" value="bugs"><span>Trop de bugs / instable</span></label>
        <label class="option"><input type="radio" name="reason" value="not_needed"><span>Je n'en ai plus besoin</span></label>
        <label class="option"><input type="radio" name="reason" value="found_alternative"><span>J'ai trouve une meilleure alternative</span></label>
        <label class="option"><input type="radio" name="reason" value="other"><span>Autre raison</span></label>

        <div class="question">Un commentaire pour nous aider ? (optionnel)</div>
        <textarea id="comment" name="comment" placeholder="Dites-nous ce qu'on pourrait ameliorer..."></textarea>

        <div class="actions">
          <button type="button" class="btn-secondary" onclick="skip()">Passer</button>
          <button type="submit" class="btn-primary">Envoyer</button>
        </div>
      </form>
      <div id="userId"></div>
    </div>

    <div id="thanks-view" class="thanks hidden">
      <div class="emoji">🙏</div>
      <h2>Merci pour votre retour !</h2>
      <p>Votre reponse nous aide a ameliorer l'application.</p>
      <p style="margin-top:24px;font-size:13px;">Vous pouvez fermer cette page.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId') || 'unknown';
    document.getElementById('userId').textContent = 'ID: ' + userId;

    function showThanks() {
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('thanks-view').classList.remove('hidden');
    }

    function skip() {
      fetch('/.netlify/functions/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, reason: 'skipped', comment: '' })
      }).catch(() => {});
      showThanks();
    }

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const reason = document.querySelector('input[name="reason"]:checked')?.value || '';
      const comment = document.getElementById('comment').value.trim();
      try {
        await fetch('/.netlify/functions/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, reason, comment })
        });
      } catch (_) {}
      showThanks();
    });
  </script>
</body>
</html>
